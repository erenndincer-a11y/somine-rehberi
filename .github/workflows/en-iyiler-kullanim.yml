name: Şömine En İyiler Eş Yazısı (Kullanım Durumu)

on:
  schedule:
    # Salı + Perşembe 21:30 Türkiye (UTC+3) — yanarsomine.com.tr yazısı 20:30'da çıkar; 23:30 yedek.
    - cron: '30 18 * * 2,4'
    - cron: '30 20 * * 2,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Yalnızca kaynak WP yazısını bul (yazı üretmez)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: somine-rehberi-yayin  # diğer şömine otomasyonlarıyla aynı kuyruk
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Paketleri yükle
        run: pip install anthropic openai pillow -q

      - name: Eş yazıyı üret (sominerehberi.com)
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/en-iyiler/generate.py --series kullanim ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit ve push (Vercel otomatik yayınlar)
        if: steps.gen.outputs.created != ''
        run: |
          git config user.name "erenndincer-a11y"
          git config user.email "280446554+erenndincer-a11y@users.noreply.github.com"
          git add src/content/yazilar public/images/posts scripts/en-iyiler/durum.json
          git commit -m "En İyiler: ${{ steps.gen.outputs.created }}"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: Yapılanlar listesine ekle (destek.visibiy.com)
        if: steps.gen.outputs.created != ''
        continue-on-error: true
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: python scripts/notify_support.py "${{ steps.gen.outputs.created }}" "En İyiler"
